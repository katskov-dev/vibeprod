services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
    # network_mode: host — ОБЯЗАТЕЛЕН. Брокер связывается с воркерами по
    # 127.0.0.1:<host-port>: порты воркеров публикуются docker-демоном на
    # хост, а в bridge-сети 127.0.0.1 внутри контейнера — его собственный
    # loopback, до опубликованных портов не достучаться. Симптом: все сессии
    # падают с «opencode serve не поднялся». В host-сети DNS контейнеров не
    # работает, поэтому MinIO доступен по 127.0.0.1:9000 (см. S3_ENDPOINT).
    #
    # Безопасность: при host-сети «публикация порта» = bind uvicorn'а.
    # VIBEPROD_BIND по умолчанию 127.0.0.1 (только локально, SSH-туннель).
    # Чтобы открыть наружу, задайте VIBEPROD_BIND=0.0.0.0 И включите
    # авторизацию VIBEPROD_LOGIN/VIBEPROD_PASSWORD — прочитайте SECURITY.md:
    # без авторизации снаружи это равносильно root-шеллу на хосте.
    # scripts/setup.sh делает это автоматически.
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./mcp:/app/mcp:ro
      - ./worker:/app/worker:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - VIBEPROD_TZ=${VIBEPROD_TZ:-Europe/Moscow}
      # Только тег (без @sha256: digest невалиден как тег сборки в docker SDK).
      # Digest базового образа закреплён в worker/Dockerfile (FROM ...@sha256).
      - VIBEPROD_OPENCODE_IMAGE=${VIBEPROD_OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode:1.18.18}
      - VIBEPROD_IDLE_TTL_MIN=${VIBEPROD_IDLE_TTL_MIN:-120}
      - VIBEPROD_PORT=${VIBEPROD_PORT:-8000}
      - VIBEPROD_BIND=${VIBEPROD_BIND:-127.0.0.1}
      # Хост-путь к data: docker-демон резолвит bind-mount'ы воркеров на ХОСТЕ,
      # внутриконтейнерный /app/data ему не виден (bind source path does not exist).
      - VIBEPROD_HOST_DATA_DIR=${PWD}/data
      # В host-сети DNS контейнеров нет — MinIO публикуется на loopback хоста.
      - VIBEPROD_S3_ENDPOINT=${VIBEPROD_S3_ENDPOINT:-http://127.0.0.1:9000}
      - VIBEPROD_S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - VIBEPROD_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - VIBEPROD_LOGIN=${VIBEPROD_LOGIN:-}
      - VIBEPROD_PASSWORD=${VIBEPROD_PASSWORD:-}
      - VIBEPROD_BROKER_URL=${VIBEPROD_BROKER_URL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
    healthcheck:
      # /api/health проверяет docker-демон и MinIO — «up» значит, что
      # брокер реально готов поднимать сессии.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${VIBEPROD_PORT:-8000}/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: ${VIBEPROD_BROKER_MEM:-384m}
    restart: unless-stopped

  minio:
    # Версия запинена (не latest): репродуцируемые деплои.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: vibeprod-minio
    command: server /data --console-address ":9001"
    ports:
      # API и консоль публикуются только на loopback хоста: их видит только
      # брокер (network_mode: host) и SSH-туннель для консоли.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      # alias local для healthcheck (mc ready local)
      - MC_HOST_local=http://localhost:9000
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Сеть воркеров: files-MCP (в контейнере playwright) ходит в MinIO по
    # имени контейнера vibeprod-minio — брокер в host-сети DNS не видит,
    # а сервисы на этой сети видят.
    networks:
      - vibeprod-mcp
    mem_limit: ${VIBEPROD_MINIO_MEM:-256m}
    restart: unless-stopped

volumes:
  minio-data:

networks:
  vibeprod-mcp:
    name: vibeprod-mcp
