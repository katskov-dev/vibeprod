services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
    # Порт публикуется только на loopback: у брокера нет аутентификации, а через
    # docker.sock он управляет докер-демоном. Прежде чем менять на 0.0.0.0,
    # прочитайте SECURITY.md — снаружи это равносильно root-шеллу на хосте.
    ports:
      - "127.0.0.1:${HARNESS_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./mcp:/app/mcp:ro
      - ./worker:/app/worker:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HARNESS_TZ=${HARNESS_TZ:-Europe/Moscow}
      - HARNESS_OPENCODE_IMAGE=${HARNESS_OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode:latest}
      - HARNESS_IDLE_TTL_MIN=${HARNESS_IDLE_TTL_MIN:-120}
      - HARNESS_PORT=${HARNESS_PORT:-8000}
      - HARNESS_HOST_DATA_DIR=${PWD}/data
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
    restart: unless-stopped
