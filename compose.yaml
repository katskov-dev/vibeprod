services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
    # Порт публикуется по умолчанию только на loopback: брокер управляет
    # докер-демоном через docker.sock. Чтобы открыть наружу — задайте
    # VIBEPROD_BIND=0.0.0.0 И включите авторизацию VIBEPROD_LOGIN/VIBEPROD_PASSWORD.
    # Прочитайте SECURITY.md: без авторизации снаружи это равносильно root-шеллу на хосте.
    ports:
      - "${VIBEPROD_BIND:-127.0.0.1}:${VIBEPROD_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./mcp:/app/mcp:ro
      - ./worker:/app/worker:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - VIBEPROD_TZ=${VIBEPROD_TZ:-Europe/Moscow}
      - VIBEPROD_OPENCODE_IMAGE=${VIBEPROD_OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode:latest}
      - VIBEPROD_IDLE_TTL_MIN=${VIBEPROD_IDLE_TTL_MIN:-120}
      - VIBEPROD_PORT=${VIBEPROD_PORT:-8000}
      - VIBEPROD_HOST_DATA_DIR=${PWD}/data
      - VIBEPROD_S3_ENDPOINT=${VIBEPROD_S3_ENDPOINT:-http://vibeprod-minio:9000}
      - VIBEPROD_S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - VIBEPROD_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - VIBEPROD_LOGIN=${VIBEPROD_LOGIN:-}
      - VIBEPROD_PASSWORD=${VIBEPROD_PASSWORD:-}
      - VIBEPROD_BROKER_URL=${VIBEPROD_BROKER_URL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
    networks:
      - vibeprod-mcp
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: vibeprod-minio
    command: server /data --console-address ":9001"
    ports:
      # API и консоль публикуются только на loopback.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - vibeprod-mcp
    restart: unless-stopped

volumes:
  minio-data:

networks:
  vibeprod-mcp:
    name: vibeprod-mcp
