services:
  playwright:
    build: .
    image: vibeprod-playwright-mcp:latest
    container_name: vibeprod-playwright
    restart: unless-stopped
    init: true
    networks:
      - vibeprod-mcp
    environment:
      - VIBEPROD_S3_ENDPOINT=${VIBEPROD_S3_ENDPOINT:-http://vibeprod-minio:9000}
      - VIBEPROD_S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - VIBEPROD_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}

networks:
  # Сеть создаёт основной compose.yaml (или брокер через docker SDK).
  # Поднимите её заранее: docker compose up -d minio
  vibeprod-mcp:
    external: true
