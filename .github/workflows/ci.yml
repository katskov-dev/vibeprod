name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build broker image
        run: docker build -f Dockerfile.broker -t vibeprod-broker:ci .

      - name: Validate compose file
        run: docker compose config --quiet

  deploy-smoke:
    # E2E-проверка деплоя: compose up (network_mode: host + healthchecks) и
    # smoke.sh без LLM-ключа (проверяем сеть брокер↔воркер, а не модель).
    # Ловит регрессии вида «в bridge-сети брокер не видит воркеров».
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compose up
        run: |
          export VIBEPROD_BIND=127.0.0.1
          export VIBEPROD_PORT=8000
          export DEEPSEEK_API_KEY=sk-smoke-dummy
          docker compose up -d --build --wait

      - name: Smoke (инфраструктура, без ответа LLM)
        run: SMOKE_SKIP_LLM=1 bash scripts/smoke.sh http://127.0.0.1:8000

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100 broker minio
