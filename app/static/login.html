<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — opencode Vibeprod</title>
<script src="/static/vendor/tailwind.js"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
</style>
</head>
<body class="bg-neutral-950 text-neutral-200 h-screen flex items-center justify-center p-4">
  <form id="login-form" class="w-full max-w-sm bg-neutral-900 border border-neutral-800 rounded-xl p-6 space-y-4 shadow-2xl">
    <div>
      <div class="font-semibold text-lg">Vibeprod</div>
      <div class="text-xs text-neutral-500">Вход</div>
    </div>
    <div>
      <label class="block text-sm text-neutral-400 mb-1" for="login">Логин</label>
      <input id="login" name="login" autocomplete="username" required
        class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-neutral-500">
    </div>
    <div>
      <label class="block text-sm text-neutral-400 mb-1" for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required
        class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-neutral-500">
    </div>
    <div id="error" class="hidden text-sm text-red-400"></div>
    <button type="submit" class="w-full bg-neutral-200 text-neutral-900 font-medium rounded-lg px-3 py-2 text-sm hover:bg-white">Войти</button>
  </form>
  <script>
    const form = document.getElementById('login-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.classList.add('hidden');
      const fd = new FormData(form);
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: fd.get('login'), password: fd.get('password') }),
      });
      if (!r.ok) {
        let detail = 'Неверный логин или пароль';
        try { detail = (await r.json()).detail || detail; } catch {}
        error.textContent = detail;
        error.classList.remove('hidden');
        return;
      }
      location.href = '/';
    });
  </script>
</body>
</html>
