[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
ignore = [
    "E501",   # длину строк держим глазами, а не линтером
    "B008",   # Depends()/Query() в дефолтах аргументов — это идиома FastAPI
    "B904",   # `raise HTTPException(...) from exc` — шума больше, чем пользы
    "UP041",  # asyncio.TimeoutError: dev-окружение на Python 3.9, прод на 3.12
    "UP045",  # Optional[...] вместо X | None — то же самое
]

[tool.pytest.ini_options]
testpaths = ["tests"]
